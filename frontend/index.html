<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finn and Morgan's Recipe Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
        <div id="login-screen" class="screen active">
        <div class="login-container">
            <h1>Finn and Morgan's Recipe Book</h1>
            <p>Welcome! Enter the password to continue.</p>
            <form id="login-form">
                <input type="password" id="password-input" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <div id="login-error" class="error"></div>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen">
        <header>
            <h1>Finn and Morgan's Recipe Book</h1>
            <button id="logout-btn" class="logout-btn">Logout</button>
        </header>

        <main>
            <!-- Add Recipe Section -->
            <section class="add-recipe-section">
                <h2>Add New Recipe</h2>
                <form id="add-recipe-form">
                    <input type="url" id="recipe-url" placeholder="Paste recipe URL here..." required>
                    <button type="submit">Scrape Recipe</button>
                </form>
                <div id="scrape-status" class="status-message"></div>

                <div class="add-divider"></div>

                <section class="manual-recipe-section">
                    <h3>Add Manually</h3>
                    <form id="manual-recipe-form">
                        <div class="manual-grid">
                            <input type="text" id="manual-title" placeholder="Recipe title" required>
                            <input type="text" id="manual-yields" placeholder="Yields (e.g., 4 servings)">
                            <input type="number" id="manual-total-time" placeholder="Total time (minutes)" min="0">
                            <input type="url" id="manual-source-url" placeholder="Optional source URL">
                            <input type="url" id="manual-image-url" placeholder="Optional image URL">
                        </div>
                        <textarea id="manual-ingredients" placeholder="Ingredients (one per line). Optional section headers end with ':'&#10;Example:&#10;Chicken:&#10;Chicken thighs&#10;Salt&#10;Sauce:&#10;Yogurt" required></textarea>
                        <textarea id="manual-instructions" placeholder="Instructions. You can use Step 1:, Step 2:, etc." required></textarea>
                        <button type="submit">Save Manual Recipe</button>
                    </form>
                    <div id="manual-status" class="status-message"></div>
                </section>
            </section>

            <!-- Search Section -->
            <section class="search-section">
                <label for="recipe-search">Search Recipes</label>
                <div class="search-controls">
                    <select id="search-mode" aria-label="Choose search type">
                        <option value="name">Recipe Name</option>
                        <option value="ingredient">Ingredient</option>
                    </select>
                    <input type="search" id="recipe-search" placeholder="Search recipe names...">
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <button class="filter-btn active" data-filter="all">All Recipes</button>
                <button class="filter-btn" data-filter="want_to_cook">Want to Cook</button>
                <button class="filter-btn" data-filter="already_cooked">Already Cooked</button>
            </section>

            <!-- Recipes Grid -->
            <section id="recipes-container" class="recipes-grid">
                <p class="loading">Loading recipes...</p>
            </section>
        </main>
    </div>

    <!-- Recipe Modal -->
    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
